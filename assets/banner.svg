<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="K. M. Arafat Islam: Explainable AI researcher and founder of Buildsign Digital">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16294a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e6b"/>
      <stop offset="1" stop-color="#f7c873"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#dots)"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="92" font-size="16" font-weight="700" letter-spacing="3" fill="#f7c873">HI, I'M</text>
    <text x="64" y="158" font-size="58" font-weight="800" fill="#ffffff">K. M. Arafat Islam</text>
    <text x="64" y="208" font-size="26" font-weight="700" fill="url(#accent)">Explainable AI Researcher</text>
    <text x="64" y="250" font-size="20" fill="#b8c4d9">SHAP and LIME for health, climate, supply chain</text>
    <text x="64" y="278" font-size="20" fill="#b8c4d9">and business decisions</text>
    <g font-size="14" font-weight="600" fill="#dbe4f3">
      <rect x="64" y="300" width="262" height="30" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <text x="195" y="320" text-anchor="middle">Founder and CEO, Buildsign Digital</text>
      <rect x="336" y="300" width="222" height="30" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <text x="447" y="320" text-anchor="middle">CSE, Daffodil Int'l University</text>
      <rect x="568" y="300" width="152" height="30" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <text x="644" y="320" text-anchor="middle">Dhaka, Bangladesh</text>
    </g>

    <!-- SHAP-style feature attribution card -->
    <g filter="url(#shadow)">
      <rect x="800" y="48" width="416" height="264" rx="14" fill="#1d2b45" stroke="#33466b"/>
    </g>
    <text x="824" y="82" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9fb0cc">WHY DID THE MODEL SAY THAT?</text>
    <line x1="1040" y1="98" x2="1040" y2="292" stroke="#4a5d82" stroke-width="1.5"/>
    <g font-size="13" fill="#c9d4e6" text-anchor="end" transform="translate(-40 0)">
      <text x="1000" y="122">feature A</text>
      <text x="1000" y="154">feature B</text>
      <text x="1000" y="186">feature C</text>
      <text x="1000" y="218">feature D</text>
      <text x="1000" y="250">feature E</text>
      <text x="1000" y="282">feature F</text>
    </g>
    <g>
      <rect x="1040" y="110" width="128" height="16" rx="4" fill="#ff5c7a"/>
      <rect x="1040" y="174" width="96" height="16" rx="4" fill="#ff5c7a"/>
      <rect x="1040" y="238" width="44" height="16" rx="4" fill="#ff5c7a"/>
    </g>
    <g fill="#3b82f6">
      <rect x="1008" y="142" width="32" height="16" rx="4"/>
      <rect x="1018" y="206" width="22" height="16" rx="4"/>
      <rect x="1026" y="270" width="14" height="16" rx="4"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="1174" y="123" fill="#ffb3c1">+0.42</text>
      <text x="1142" y="187" fill="#ffb3c1">+0.27</text>
      <text x="1090" y="251" fill="#ffb3c1">+0.12</text>
      <text x="1003" y="155" text-anchor="end" fill="#93c5fd">-0.09</text>
      <text x="1013" y="219" text-anchor="end" fill="#93c5fd">-0.06</text>
      <text x="1021" y="283" text-anchor="end" fill="#93c5fd">-0.04</text>
    </g>
  </g>
</svg>
